name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint scripts
        run: shellcheck -s sh skills/rex-teams/scripts/*
      - name: Check the skill's name matches its folder
        run: |
          name=$(sed -n 's/^name: //p' skills/rex-teams/SKILL.md)
          test "$name" = rex-teams || { echo "SKILL.md name is '$name', expected 'rex-teams'"; exit 1; }
      - name: Check scripts are executable
        run: test -x skills/rex-teams/scripts/spawn && test -x skills/rex-teams/scripts/send
